[project]
name = "rlcdselect"
version = "0.1.0"
description = "Controlled research harness comparing native LLM, decomposed LLM, and RLCD tool selection."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlcdselect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
