[project]
name = "rlcdselect"
version = "0.1.0"
description = "Controlled research harness comparing native LLM, decomposed LLM, and RLCD tool selection."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "jsonschema>=4.23",
    "openai>=2",
    "system-one-adapter[openai]==0.2.1",
    "typesafe-sdk==0.7.4",
]

[project.optional-dependencies]
laya = [
    "laya==0.4.7",
    "torch==2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlcdselect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
